<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial;
    margin:0;
    background: linear-gradient(120deg, #e3f2fd, #f1f8e9);
}

.header {
    background:#1b5e20;
    color:white;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-logo {
    width: 40px;
    height: 40px;
    object-fit: contain;
    margin-right: 10px;
}

.header a {
    color:white;
    text-decoration:none;
    margin-left:10px;
    font-size:14px;
}

.container {
    display:flex;
    justify-content:center;
    padding:15px;
}

.form-card {
    background:white;
    padding:20px;
    border-radius:12px;
    width:100%;
    max-width:700px;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

.form-grid {
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:15px;
}

.form-group {
    display:flex;
    flex-direction:column;
}

.form-group.full {
    grid-column: span 2;
}

h2 {
    text-align:center;
    color:#2e7d32;
}

label {
    font-weight:bold;
}

input, textarea, select {
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
}

button {
    width:100%;
    background:#2e7d32;
    color:white;
    padding:12px;
    border:none;
    border-radius:6px;
    margin-top:20px;
}

.success {
    text-align:center;
    color:green;
    font-weight:bold;
    margin-top:10px;
}

</style>

<script>

function calculateTotal() {

    var boys = parseInt(document.getElementById('boys').value) || 0;
    var girls = parseInt(document.getElementById('girls').value) || 0;

    document.getElementById('total').value = boys + girls;
}

// SAFE FORM VALIDATION (prevents 500 errors)
function validateForm() {

    let school = document.getElementsByName("school")[0].value;
    let udisc = document.getElementsByName("udisc")[0].value;
    let location = document.getElementsByName("location")[0].value;

    if (!school || !udisc || !location) {
        alert("Please fill required fields: School, UDISC, Location");
        return false;
    }

    return true;
}

</script>

</head>

<body>

<div class="header">

    <div style="display:flex; align-items:center;">
        <img src="{{ url_for('static', filename='logo.png') }}"
             class="header-logo"
             alt="Logo">

        <strong>Ummid Foundation (Hope for Human)</strong>
    </div>

    <div>
        <a href="/export">Download Excel</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="container">

<div class="form-card">

<h2>School Data Entry</h2>

<form method="post" enctype="multipart/form-data" onsubmit="return validateForm()">

<div class="form-grid">

<div class="form-group">
<label>UDISC Number</label>
<input name="udisc" required>
</div>

<div class="form-group">
<label>School Name</label>
<input name="school" required>
</div>

<div class="form-group">
<label>Location</label>
<input name="location" required>
</div>

<div class="form-group">
<label>Year of Establishment</label>
<input name="year">
</div>

<div class="form-group">
<label>Girls</label>
<input id="girls" name="girls" onkeyup="calculateTotal()">
</div>

<div class="form-group">
<label>Boys</label>
<input id="boys" name="boys" onkeyup="calculateTotal()">
</div>

<div class="form-group">
<label>Total Students</label>
<input id="total" name="total" readonly>
</div>

<div class="form-group">
<label>Company Name</label>
<input name="company">
</div>

<div class="form-group">
<label>FY</label>
<input name="fy">
</div>

<div class="form-group">
<label>Phase</label>
<select name="phase">
<option>1st Phase</option>
<option>2nd Phase</option>
<option>3rd Phase</option>
<option>4th Phase</option>
</select>
</div>

<div class="form-group full">
<label>Remarks</label>
<textarea name="remarks"></textarea>
</div>

<div class="form-group full">
<label>Smart Class Photos</label>
<input type="file" name="smart_class" multiple>
</div>

<div class="form-group full">
<label>RO Photos</label>
<input type="file" name="ro" multiple>
</div>

<div class="form-group full">
<label>Sanitary Photos</label>
<input type="file" name="sanitary" multiple>
</div>

<div class="form-group full">
<label>Toilet Photos</label>
<input type="file" name="toilet" multiple>
</div>

</div>

<button type="submit">Submit</button>

</form>

{% if success %}
<p class="success">Data + Images Saved ✅</p>
{% endif %}

</div>
</div>

</body>
</html>
